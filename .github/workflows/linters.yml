name: Linters

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: linters-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # diff-aware: only findings on lines a pull request adds or changes are reported

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download Frappe Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep
        run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Conventional commit subjects
        run: |
          bad=$(git log --format=%s "origin/${{ github.base_ref }}..HEAD" --no-merges \
            | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|wip)(\([^)]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then
            echo "These commit subjects do not follow type(scope): subject:"
            echo "$bad"
            exit 1
          fi
